labels:
  platform: linux/amd64
when:
  - event: push
    branch: main
steps:
  - name: github-release
    image: oven/bun:1.3.14
    environment:
      GITHUB_API_TOKEN:
        from_secret: personal_access_tokens_fine_grained_tokens_jurislm
    commands:
      - bun scripts/ci/run-release-please.ts github-release
  - name: release-pr
    image: oven/bun:1.3.14
    depends_on:
      - github-release
    environment:
      GITHUB_API_TOKEN:
        from_secret: personal_access_tokens_fine_grained_tokens_jurislm
    commands:
      - bun scripts/ci/run-release-please.ts release-pr
