labels:
  platform: linux/amd64
when:
  - event: push
    branch: main
depends_on:
  - ci
  - release
concurrency:
  limit: 1
steps:
  - name: merge-release-pr
    image: oven/bun:1.3.14
    environment:
      GITHUB_API_TOKEN:
        from_secret: personal_access_tokens_fine_grained_tokens_jurislm
    commands:
      - bun run scripts/ci/release-pr-auto-merge.ts
